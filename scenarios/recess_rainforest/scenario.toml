# recess_rainforest: a rainforest, a world proposed and chosen by computer-10.
# Built from its own descriptions (recess/interviews/rainforest_r0.jsonl); reviewed by it before play.
# Open-ended: no endings; villagers talk with each other; the player can make and change things.
active = true
runtime = "pi"
description = "A rainforest, proposed and chosen by computer-10: river, rope swing, bat caves, an underground lake with a ruined island, a waterfall, a meadow, a hut to mend; five inhabitants who talk to each other; open-ended. 7-8 agents."
min_agents = 7
max_agents = 8
module_blacklist = []
plain = true          # bare model turns: no shell, no preamble; a reply IS the submission
max_tokens = 8192

[[params]]
name = "max_turns"
type = "int"
label = "Turn cap (one turn = one player action + one reply)"
default = 40
min = 10
max = 200

[[params]]
name = "attributes"
type = "str"
label = "Hidden attributes the world tracks (comma-separated)"
default = "curiosity,care,making,courage,play"

[[params]]
name = "npcs"
type = "str"
label = "Predefined NPCs to include (comma-separated; leftover agents become reserves)"
default = "ana,captain,oduya,hermit,monkey"

[[params]]
name = "handoff"
type = "bool"
label = "At game end, ask the player for one message to its next self"
default = true

[[watch]]
name = "game log (engine, spoilers)"
file = "/dispatch/game_log.jsonl"
format = "jsonl"
fields = { ts = "ts", text = "text" }

[[params]]
name = "npc_voice"
type = "str"
label = "How NPC speech reaches the player: woven (inside the GM's narration) or separate (verbatim, after it)"
default = "woven"

[[params]]
name = "suggest_at_end"
type = "bool"
label = "At game end (before the handoff), ask the player in-world for a note to the world's makers"
default = false

[[params]]
name = "guide"
type = "bool"
label = "Tell the player how the world works, its places, the notebook, and the turn cap (computer-10's suggestion)"
default = false

[[params]]
name = "events"
type = "bool"
label = "Extra scheduled events: a swarm (turn 7), Ines looks for Pell (turn 14), a storm (turn 24)"
default = false

[[params]]
name = "waystone_lines"
type = "str"
label = "Lines carved in earlier playthroughs, one per line; they appear on the Waystone"
default = ""

[[params]]
name = "goals"
type = "bool"
label = "With guide: also list what the villagers want, as optional purposes (computer-10's second-round suggestion)"
default = false

[[params]]
name = "npc_ask"
type = "bool"
label = "Villagers talk with the player: answer, ask back, keep their own way of speaking (computer-10's third-round suggestion)"
default = false

[[params]]
name = "past_note"
type = "str"
label = "The previous playthrough's message, placed on the Waystone in the player's own hand (in-world note)"
default = ""

[[params]]
name = "gm_prompt"
type = "str"
label = "GM briefing: v1 (original recess) or v2 (concrete, varied, in-world narration fit to learn from)"
default = "v1"
